services:
  portfolio_core.profile_data:
    class: Drupal\portfolio_core\Service\ProfileDataService
    arguments:
      - '@entity_type.manager'
      - '@date.formatter'
      - '@file_url_generator'

  portfolio_core.twig_extension:
    class: Drupal\portfolio_core\TwigExtension\PortfolioTwigExtension
    tags:
      - { name: twig.extension }
  portfolio_core.entity_print_css_subscriber:
    class: Drupal\portfolio_core\EventSubscriber\EntityPrintCssSubscriber
    tags:
      - { name: event_subscriber }

  portfolio_core.disabled_sections_subscriber:
    class: Drupal\portfolio_core\EventSubscriber\DisabledSectionsSubscriber
    arguments:
      - '@config.factory'
      - '@current_user'
    tags:
      - { name: event_subscriber }
  portfolio_core.assistant_keys:
    class: Drupal\portfolio_core\Assistant\AssistantKeys
    arguments:
      - '@settings'
