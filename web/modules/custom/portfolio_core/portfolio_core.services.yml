services:
  portfolio_core.profile_data:
    class: Drupal\portfolio_core\Service\ProfileDataService
    arguments:
      - '@entity_type.manager'
      - '@date.formatter'
      - '@file_url_generator'

  portfolio_core.twig_extension:
    class: Drupal\portfolio_core\TwigExtension\PortfolioTwigExtension
    tags:
      - { name: twig.extension }
  portfolio_core.entity_print_css_subscriber:
    class: Drupal\portfolio_core\EventSubscriber\EntityPrintCssSubscriber
    tags:
      - { name: event_subscriber }

  portfolio_core.disabled_sections_subscriber:
    class: Drupal\portfolio_core\EventSubscriber\DisabledSectionsSubscriber
    arguments:
      - '@config.factory'
      - '@current_user'
    tags:
      - { name: event_subscriber }
  portfolio_core.assistant_keys:
    class: Drupal\portfolio_core\Assistant\AssistantKeys
    arguments:
      - '@settings'
  portfolio_core.answer_parser:
    class: Drupal\portfolio_core\Assistant\AnswerParser
  logger.channel.portfolio_core:
    parent: logger.channel_base
    arguments: ['portfolio_core']
  portfolio_core.llm.groq:
    class: Drupal\portfolio_core\Assistant\GroqClient
    arguments: ['@http_client', '@portfolio_core.assistant_keys', '@config.factory']
    tags:
      - { name: portfolio_core.llm_client }
  portfolio_core.llm.gemini:
    class: Drupal\portfolio_core\Assistant\GeminiClient
    arguments: ['@http_client', '@portfolio_core.assistant_keys', '@config.factory']
    tags:
      - { name: portfolio_core.llm_client }
  portfolio_core.llm_chain:
    class: Drupal\portfolio_core\Assistant\LlmChain
    arguments:
      - '@config.factory'
      - !tagged_iterator portfolio_core.llm_client
      - '@logger.channel.portfolio_core'
  portfolio_core.assistant_context:
    class: Drupal\portfolio_core\Assistant\AssistantContextBuilder
    arguments:
      - '@entity_type.manager'
      - '@portfolio_core.profile_data'
      - '@cache.default'
      - '@datetime.time'
  portfolio_core.ask_validator:
    class: Drupal\portfolio_core\Assistant\AskRequestValidator
  portfolio_core.cv_tailoring_prompt:
    class: Drupal\portfolio_core\Cv\CvTailoringPrompt
