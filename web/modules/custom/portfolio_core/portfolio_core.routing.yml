portfolio_core.ask:
  path: '/api/portfolio/ask'
  defaults:
    _controller: '\Drupal\portfolio_core\Controller\AskController::ask'
  methods: [POST]
  requirements:
    # Public on purpose: anonymous visitors chat with Droopy. Abuse is limited
    # by flood control, origin checks and input validation in AskController.
    _access: 'TRUE'
  options:
    no_cache: TRUE

portfolio_core.tailored_cv:
  path: '/admin/portfolio/tailored-cv'
  defaults:
    _form: '\Drupal\portfolio_core\Form\TailoredCvForm'
    _title: 'Tailored CV'
  requirements:
    _permission: 'use tailored cv'
  options:
    _admin_route: TRUE
