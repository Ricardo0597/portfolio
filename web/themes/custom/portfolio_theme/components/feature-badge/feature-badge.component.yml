$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Feature Badge'
description: 'Compact card for listing Drupal feature demos.'
props:
  type: object
  properties:
    title:
      type: string
      title: 'Feature title'
    pattern:
      type: string
      title: 'Drupal pattern demonstrated'
    difficulty:
      type: string
      title: 'Difficulty level'
    path:
      type: string
      title: 'Node path/alias'
