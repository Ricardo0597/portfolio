name: CI

# Code checks only — this workflow never deploys.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP tests and coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, pdo_sqlite, mbstring, xml, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Security audit
        run: composer audit

      - name: Unit tests
        run: ./vendor/bin/phpunit -c web/core web/modules/custom/portfolio_core/

      - name: Drupal coding standards
        run: >
          ./vendor/bin/phpcs
          --standard=Drupal,DrupalPractice
          --extensions=php,module,inc,install,theme,yml
          --ignore=node_modules,*.css,*.js
          web/modules/custom web/themes/custom/portfolio_theme
